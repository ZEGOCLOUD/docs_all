openapi: 3.0.0
info:
  title: open-api-desc
  version: 1.0.0
  contact:
    name: ZEGO Support
    email: support@zegocloud.com

servers:
  $ref: '../shared-components.yaml#/servers'

paths:
  /:
    post:
      tags:
        - call-invitation
      summary: CallAck
      description: |
        通过该接口可以为用户发送回执。

        用户接受邀请进入呼叫后，通过以下 ZIM SDK 的回调接口，其他处于呼叫中的用户会收到呼叫用户状态变更的通知：

        | iOS-25% | Android-25% | macOS-25% | Windows-25% |
        |-----|---------|--------|---------|
        | [callUserStateChanged](/zim-ios/client-sdks/api-reference/protocol#zimcalluserstatechangedcallid-zimeventhandler) | [onCallUserStateChanged](/zim-android/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [callUserStateChanged](/zim-macos/client-sdks/api-reference/protocol#zimcalluserstatechangedcallid-zimeventhandler) | [onCallUserStateChanged](/zim-win/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) |

        | Web-25% | 小程序-25% | Flutter-25% | React Native-25% |
        |-----|--------|---------|--------------|
        | [onCallUserStateChanged](/zim-web/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [onCallUserStateChanged](/zim-miniprogram/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [onCallUserStateChanged](/zim-flutter/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [onCallUserStateChanged](/zim-rn/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) |

        | Unity3D-25% | uniapp \| uniapp x-25% | HarmonyOS-25% |
        |---------|---------|------------|
        | [OnCallUserStateChanged](/zim-u3d/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [callUserStateChanged](/zim-uniapp-x/client-sdks/api-reference/interface#calluserstatechanged-zimeventhandler) | [callUserStateChanged](/zim-harmonyos/client-sdks/api-reference/interface#calluserstatechanged-zimeventhandler) |

        <Note title="说明">调用频率限制：20 次/秒</Note>
      operationId: ack-a-call-invitation
      parameters:
        - name: Action
          in: query
          description: |
            > 接口原型参数
            >
            > https://zim-api.zego.im/?Action=CallAck
          required: true
          allowEmptyValue: false
          schema:
            type: string
            enum: [CallAck]
          style: form
          explode: true
        - $ref: '../shared-components.yaml#/components/parameters/AppId'
        - $ref: '../shared-components.yaml#/components/parameters/SignatureNonce'
        - $ref: '../shared-components.yaml#/components/parameters/Timestamp'
        - $ref: '../shared-components.yaml#/components/parametersV2/SignatureVersion'
        - $ref: '../shared-components.yaml#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallAckRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAckResponse'

components:
  schemas:
    CallAckRequest:
      type: object
      required: [FromUserId, CallId]
      properties:
        FromUserId:
          type: string
          description: |
            操作者（呼叫邀请接收方）的用户 ID，需要是已注册状态且为该呼叫的被叫成员。
          maxLength: 32
          example: "callee_user"
        CallId:
          type: string
          description: |
            呼叫 ID，来自呼叫创建接口的返回值。
          maxLength: 32
          example: "call123"

    CallAckResponse:
      type: object
      properties:
        Code:
          type: integer
          description: |
            返回码。（0 表示成功）

            以下仅列出了接口业务逻辑相关的返回码，完整返回码请参考 [全局返回码](/zim-server/return-codes)。
            <table>
            <tbody><tr>
            <th>返回码</th>
            <th>说明</th>
            <th>处理建议</th>
            </tr>
            <tr>
            <td>660000002</td>
            <td>参数错误</td>
            <td>请检查参数。</td>
            </tr>
            <tr>
            <td>660300005</td>
            <td>频率限制</td>
            <td>请稍后再尝试。</td>
            </tr>
            <tr>
            <td>660900004</td>
            <td>获取呼叫失败或已结束</td>
            <td>请检查 CallId 和呼叫状态。</td>
            </tr>
            <tr>
            <td>660900008</td>
            <td>用户不属于该呼叫</td>
            <td>请检查 FromUserId 是否为被叫成员。</td>
            </tr>
            </tbody></table>
          example: 0
        Message:
          type: string
          description: 返回状态信息。
          example: success
        RequestId:
          type: string
          description: 请求唯一标识。
          example: '343649807833778782'
