openapi: 3.0.0
info:
  title: open-api-desc
  version: 1.0.0
  contact:
    name: ZEGO Support
    email: support@zegocloud.com
servers:
  $ref: ../shared-components.yaml#/servers
paths:
  /:
    post:
      tags:
      - call-invitation
      summary: CallAck
      description: |
        This API sends a delivered receipt for an offline call invitation on behalf of a user.

        After the user accepts the invitation and enters the call, other users in the call will receive a notification of the call user status change through the following ZIM SDK callback:

        | iOS-25% | Android-25% | macOS-25% | Windows-25% |
        |----|----|----|----|
        | [callUserStateChanged](/zim-ios/client-sdks/api-reference/protocol#zimcalluserstatechangedcallid-zimeventhandler) | [onCallUserStateChanged](/zim-android/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [callUserStateChanged](/zim-macos/client-sdks/api-reference/protocol#zimcalluserstatechangedcallid-zimeventhandler) | [onCallUserStateChanged](/zim-win/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) |

        | Web-25% | Flutter-25% | React Native-25% | Unity3D-25% |
        |----|----|----|----|
        | [onCallUserStateChanged](/zim-web/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [onCallUserStateChanged](/zim-flutter/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [onCallUserStateChanged](/zim-rn/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) | [OnCallUserStateChanged](/zim-u3d/client-sdks/api-reference/class#oncalluserstatechanged-zimeventhandler) |

        <Note title="QPS Limit">20 requests/s</Note>
      operationId: ack-a-call-invitation
      parameters:
      - name: Action
        in: query
        description: |
          > API prototype parameter
          >
          > https://zim-api.zego.im/?Action=CallAck
        required: true
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - CallAck
        style: form
        explode: true
      - $ref: ../shared-components.yaml#/components/parameters/AppId
      - $ref: ../shared-components.yaml#/components/parameters/SignatureNonce
      - $ref: ../shared-components.yaml#/components/parameters/Timestamp
      - $ref: ../shared-components.yaml#/components/parametersV2/SignatureVersion
      - $ref: ../shared-components.yaml#/components/parameters/Signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallAckRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAckResponse'
components:
  schemas:
    CallAckRequest:
      type: object
      required:
      - FromUserId
      - CallId
      properties:
        FromUserId:
          type: string
          description: |
            The user ID of the operator (the recipient of the call invitation). The user must be registered and must be a callee in this call.
          maxLength: 32
          example: callee_user
        CallId:
          type: string
          description: |
            The call ID returned by the API that created the call.
          maxLength: 32
          example: call123
    CallAckResponse:
      type: object
      properties:
        Code:
          type: integer
          description: |
            Return code. 0 indicates success.

            The following table lists only the return codes related to this API's business logic. For the complete list, see [Return codes](/zim-server/return-codes).
            <table>
            <tbody><tr>
            <th>Return code</th>
            <th>Description</th>
            <th>Suggested actions</th>
            </tr>
            <tr>
            <td>660000002</td>
            <td>Invalid parameters.</td>
            <td>Check the parameters.</td>
            </tr>
            <tr>
            <td>660300005</td>
            <td>Rate limit exceeded.</td>
            <td>Try again later.</td>
            </tr>
            <tr>
            <td>660900004</td>
            <td>The call could not be retrieved or has ended.</td>
            <td>Check CallId and the call status.</td>
            </tr>
            <tr>
            <td>660900008</td>
            <td>The user is not a member of this call.</td>
            <td>Check whether FromUserId is a callee in the call.</td>
            </tr>
            </tbody></table>
          example: 0
        Message:
          type: string
          description: Response status information.
          example: success
        RequestId:
          type: string
          description: Unique request identifier.
          example: '343649807833778782'
