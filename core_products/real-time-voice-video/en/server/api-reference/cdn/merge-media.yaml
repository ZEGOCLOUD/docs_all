openapi: 3.0.0
info:
  title: open-api-desc
  version: 1.0.0
  contact:
    name: Real-time Voice/Video API Support
    email: support@zegocloud.com

tags:
  - name: cdn

servers:
  $ref: '../shared-components.yaml#/servers'

paths:
  /:
    get:
      tags: [cdn]
      summary: Merge Media Files
      operationId: merge-media
      description: |
        When performing CDN recording, recorded media files are stored on CDN servers. You can call this API to `crop` and `merge` multiple media files.

        Currently, only media files in MP3/MP4/M3U8 formats can be merged.

        <Warning title="Warning">

        - Before using this API for the first time, confirm that CDN recording has been enabled. If it has not been enabled, go to the [ZEGOCLOUD Console](https://console.zegocloud.com) to enable it. For details, see [Console - Service Configuration - CDN](/console/service-configuration/activate-cdn-service), or contact ZEGOCLOUD Technical Support.
        - Contact ZEGOCLOUD Technical Support to enable the media file merging feature and configure a callback URL. After media file merging is completed, the [Media File Merge Complete Callback](/real-time-video-server/callback/cdn/merge-media-completed) will be triggered.
        - Recording files merged using this feature are permanently retained, and the retention period cannot be changed through configuration. To delete a file, call the [Delete Media File](/real-time-video-server/api-reference/cdn/delete-media) API.

        </Warning>

        <Note title="Call frequency limit">All rooms under the same AppID: 20 requests/second</Note>
      parameters:
        - name: Action
          in: query
          required: true
          description: |
            > API prototype parameter
            >
            > https://rtc-api.zego.im/?Action=MergeMedia
          schema:
            type: string
            enum: [MergeMedia]
          style: form
          explode: true
        - $ref: '../shared-components.yaml#/components/parameters/AppId'
        - $ref: '../shared-components.yaml#/components/parameters/SignatureNonce'
        - $ref: '../shared-components.yaml#/components/parameters/Timestamp'
        - $ref: '../shared-components.yaml#/components/parameters/Signature'
        - $ref: '../shared-components.yaml#/components/parameters/SignatureVersion'
        - name: Vendor
          in: query
          required: true
          schema:
            type: string
            enum: [Tencent, Huawei]
          description: |
            Possible values and corresponding CDN vendors:
            - Tencent: Tencent Cloud.
            - Huawei: Huawei Cloud.
        - name: Format
          in: query
          required: false
          schema:
            type: string
            default: MP4
          description: |
            Format of the merged file. The default format is MP4.
            - Tencent Cloud: MP3, MP4, M3U8.

              <Warning title="Warning">When the CDN vendor is Tencent Cloud and the merged file is in MP3 or MP4 format, ensure that the audio format of the source file is AAC-LC. Otherwise, the merged video file may have no sound.</Warning>
            - Huawei Cloud: MP4, M3U8.
        - name: Type
          in: query
          required: false
          example: "1"
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
          description: |
            Merge operation type.
            - 0: Default value. Merge files directly without cropping.
            - 1: Crop or otherwise process media files before merging them. In this case, `InputFileId[]` is invalid and `HandleMediaArgs.N.FileId` must be passed.

            **When this parameter is set to 1, it is valid only when Vendor is Tencent and is invalid when Vendor is Huawei.**
        - name: InputFileId
          in: query
          required: false
          x-docuo-display-name: InputFileId[]
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
          style: form
          explode: true
          description: |
            - When Type is 0, this parameter is valid and required.
            - When Type is 1, this parameter is invalid.

            List of file IDs to merge. Files are merged in list order. Specifically:
            - Tencent Cloud: Pass the `FileID` returned by the [Recording File Generation Callback](/real-time-video-server/callback/cdn/cdn-record-completed). A maximum of 10 files can be merged.
            - Huawei Cloud: Pass the `ObsObject` returned by the [Recording File Generation Callback](/real-time-video-server/callback/cdn/cdn-record-completed). A maximum of 20 files can be merged.

            Example: `InputFileId[]=5285890813221514958&InputFileId[]=5285890813221513290`
        - name: HandleMediaArgs
          in: query
          required: false
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items:
              type: object
              required: [FileId]
              properties:
                FileId:
                  type: string
                  description: |
                    List of file IDs to crop and then merge. **Files are merged in ascending order of N in the parameter names. A maximum of 10 files can be merged.**

                    - Tencent Cloud: Pass the `FileID` returned by the [Recording File Generation Callback](/real-time-video-server/callback/cdn/cdn-record-completed).
                    - Huawei Cloud: Pass the `ObsObject` returned by the [Recording File Generation Callback](/real-time-video-server/callback/cdn/cdn-record-completed).

                    <Warning title="Warning">N must start at 0 and increase continuously, with a maximum value of 9. If N does not start at 0 or a number is skipped, the files cannot be cropped and merged correctly.</Warning>

                    For example, `HandleMediaArgs.0.FileId=5285890813221514958&HandleMediaArgs.1.FileId=5285890813221513290`
                StartTime:
                  type: number
                  format: double
                  minimum: 0
                  default: 0
                  description: |
                    Start-time offset for cropping the media file corresponding to `HandleMediaArgs.N.FileId`. The default value is 0, in seconds.

                    For example, `HandleMediaArgs.0.StartTime` specifies the start time for cropping the media file identified by `HandleMediaArgs.0.FileId`.
                EndTime:
                  type: number
                  format: double
                  minimum: 0
                  description: |
                    End-time offset for cropping the media file corresponding to `HandleMediaArgs.N.FileId`. The default value is the end time of the video file, in seconds.

                    For example, `HandleMediaArgs.0.EndTime` specifies the end time for cropping the media file identified by `HandleMediaArgs.0.FileId`.
          example:
            - FileId: "5576678019238910395"
              StartTime: 0.5
              EndTime: 10.5
            - FileId: "5576678019238910395"
              StartTime: 10
              EndTime: 15
          x-docuo-query-serialization:
            style: recursive-indexed-dot
            indexStart: 0
            indexLabels: [N]
          description: |
            This parameter is valid when Type is 1.
        - name: OutputFileName
          in: query
          required: false
          schema:
            type: string
          description: |
            - When Vendor is Tencent, this parameter is required.
            - When Vendor is Huawei, this parameter is optional. If it is not specified, the system automatically generates a name.

            Name of the merged media file, excluding the file format.

            URL-encode the value of this parameter before passing it.
        - name: ExpireTime
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          description: |
            Valid retention period of the merged media file, in hours. File expiration time = API request time + valid retention period.
            - 0 (default): The file is permanently retained and does not expire.
            - Greater than 0: The file is deleted after the specified period.

            <Warning title="Warning">
            <ul>
            <li>This field is valid only when Vendor is Tencent.</li>
            <li>If the media file merging task takes longer to complete than the specified retention period, the file will not be generated, and accessing the merged file URL provided by the <a href="/real-time-video-server/callback/cdn/merge-media-completed">Media File Merge Complete Callback</a> will return 404.</li>
            </ul>
            </Warning>
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeMediaResponse'
              example:
                Code: 0
                Message: success
                RequestId: "3574501647605445341"
                Data:
                  Tencent:
                    TaskId: "1400341231-EditMedia-0d8b6f0a5c457f5722e6b27796ce1f2ctt0"
                    RequestId: "07f0bdbc-6a52-4ef9-ba7b-e96d6c81d6c3"
                  Huawei:
                    RequestId: "7a690e874857106ccfa5bed198cdsd79"
                    TaskId: "112037345"

components:
  schemas:
    MergeMediaResponse:
      type: object
      properties:
        Code:
          type: integer
          format: int32
          example: 0
          description: |
            Return code.
            <br/>
            The following table lists only the return codes related to the business logic of this API. For the complete list, see [Global Return Codes](/real-time-video-server/api-reference/return-codes).
            <table>
              <thead>
                <tr><th>Return Code</th><th>Description</th><th>Suggested Action</th></tr>
              </thead>
              <tbody>
                <tr><td>0</td><td>Request succeeded.</td><td>-</td></tr>
                <tr><td>2</td><td>Invalid input parameter.</td><td>-</td></tr>
                <tr><td>3</td><td>Required permission has not been enabled.</td><td>Contact ZEGOCLOUD Technical Support.</td></tr>
                <tr><td>4</td><td>CDN type mismatch.</td><td>Check the parameters.</td></tr>
                <tr><td>5</td><td>Configuration error.</td><td>Contact ZEGOCLOUD Technical Support.</td></tr>
                <tr><td>6</td><td>Requests are too frequent.</td><td>Try again later.</td></tr>
                <tr><td>7</td><td>Authentication failed.</td><td>Check whether the authentication parameters are correct.</td></tr>
                <tr><td>1000</td><td>Request failed.</td><td>Contact ZEGOCLOUD Technical Support.</td></tr>
                <tr><td>41003</td><td>File does not exist.</td><td>Check whether the file format and file ID are correct.</td></tr>
              </tbody>
            </table>
        Message:
          type: string
          description: Description of the operation result.
          example: success
        RequestId:
          type: string
          description: Request ID returned by the ZEGOCLOUD server.
          example: "3574501647605445341"
        Data:
          type: object
          description: Response data.
          properties:
            Tencent:
              type: object
              description: Returned when Vendor is Tencent.
              properties:
                TaskId:
                  type: string
                  description: Task ID for producing the media file. You can use this ID to query the production task.
                  example: "1400341231-EditMedia-0d8b6f0a5c457f5722e6b27796ce1f2ctt0"
                RequestId:
                  type: string
                  description: Unique request ID returned by the CDN vendor corresponding to Vendor, namely Tencent Cloud. Provide this RequestId when troubleshooting.
                  example: "07f0bdbc-6a52-4ef9-ba7b-e96d6c81d6c3"
            Huawei:
              type: object
              description: Returned when Vendor is Huawei.
              properties:
                TaskId:
                  type: string
                  description: Task ID for producing the media file. You can use this ID to query the production task.
                  example: "112037345"
                RequestId:
                  type: string
                  description: Unique request ID returned by the CDN vendor corresponding to Vendor, namely Huawei Cloud. Provide this RequestId when troubleshooting.
                  example: "7a690e874857106ccfa5bed198cdsd79"
